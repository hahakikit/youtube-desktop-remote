<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>&#160;</title>
  <link rel="stylesheet" href="controller.css">
</head>
<body>
  <main>
    <div class="topline"><span class="dot"></span><span id="title">正在連接 YouTube…</span></div>
    <div class="jump-options" aria-label="跳轉秒數">
      <span>跳轉</span>
      <button class="jump active" data-seconds="5">5秒</button>
      <button class="jump" data-seconds="10">10秒</button>
      <button class="jump" data-seconds="30">30秒</button>
      <button class="jump" data-seconds="60">60秒</button>
    </div>
    <div class="controls">
      <button data-action="back" id="back" title="後退 5 秒">↶<small>5</small></button>
      <button data-action="toggle" id="play" class="primary" title="啟動／暫停">○</button>
      <button data-action="forward" id="forward" title="前進 5 秒">↷<small>5</small></button>
      <button data-action="mute" id="mute" title="靜音">🚫&#xfe0e;</button>
    </div>
    <div class="time"><span id="current">0:00</span><input id="progress" type="range" min="0" max="100" value="0" step="0.1" aria-label="影片進度"><span id="duration">0:00</span></div>
    <div class="volume"><span>音量</span><input id="volume" type="range" min="0" max="100" value="100" step="1" aria-label="音量"><span id="volume-value">100</span></div>
  </main>
  <script src="controller.js"></script>
</body>
</html>
